spring.application.name=hospital-management-system

server.port=8080

# H2 in-memory database (zero setup, resets on restart).
# To use MySQL/Postgres instead, swap these 4 lines out for the relevant driver settings.
spring.datasource.url=jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console at http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:hospitaldb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=ThisIsADemoSecretKeyForHMSPleaseChangeInProduction123456
jwt.expiration-ms=86400000
